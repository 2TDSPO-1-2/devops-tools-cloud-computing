name: arkive-devops

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: arkive-oracle-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      APP_USER: ${ARKIVE_DB_USER}
      APP_USER_PASSWORD: ${ARKIVE_DB_PASSWORD}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  arkive-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkive-api
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: ${ARKIVE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ARKIVE_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  oracle-data:
    name: arkive-oracle-data